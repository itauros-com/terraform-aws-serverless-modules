name: release-please

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  # On every push to main, opens or updates the release PR: next version, computed
  # from the Conventional Commits since the last tag, and the CHANGELOG entry. Merging
  # it creates the tag; the CHANGELOG is the release notes.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub does not start workflows from events caused by GITHUB_TOKEN, so the
      # release PR gets no `pull_request` run of ci, and without `ci-ok` the ruleset
      # on main would not let it merge. workflow_dispatch is the exception: the run
      # reports its checks on the release branch's head commit, which is the PR's.
      #
      # The PR is read with jq and not with fromJSON: a step's env is evaluated even
      # when its `if` is false, and `pr` is empty on a push that opens no release PR.
      - if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(jq -r .headBranchName <<<"$PR")"

      # Only the tag is wanted. release-please creates the tag by creating the GitHub
      # release, and with `skip-github-release` it creates neither, and then refuses to
      # open the next release PR while a merged one is untagged. So the release is
      # created and deleted here, and the tag stays: `gh release delete` keeps it.
      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
