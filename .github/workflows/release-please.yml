name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # On every push to main, opens or updates the release PR: next version, computed
  # from the Conventional Commits since the last tag, and the CHANGELOG entry. Merging
  # it creates the tag; the CHANGELOG is the release notes.
  #
  # The release PR is opened by github-actions[bot], and GitHub holds its `pull_request`
  # run of ci until someone approves it: `ci-ok`, which the ruleset on main requires,
  # appears only after that. A workflow_dispatch run of ci on the release branch does
  # not count as the PR's check.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only the tag is wanted. release-please creates the tag by creating the GitHub
      # release, and with `skip-github-release` it creates neither, and then refuses to
      # open the next release PR while a merged one is untagged. So the release is
      # created and deleted here, and the tag stays: `gh release delete` keeps it.
      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
